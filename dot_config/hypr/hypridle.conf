## ~/.config/hypr/hypridle.conf

# OJO: con la config de Hyprland en Lua, "hyprctl dispatch" espera una
# expresión Lua. "dispatch dpms on" ya no parsea (y peor: al fallar el
# parseo caía a TOGGLE), así que hay que usar hl.dsp.dpms({ action = ... }).
general {
    lock_cmd = pidof hyprlock || hyprlock       # evita lanzar hyprlock dos veces
    before_sleep_cmd = loginctl lock-session     # bloquea justo antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'   # reactiva pantalla al despertar
}

# Atenuar brillo a los 2.5 min de inactividad
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Bloquear pantalla a los 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apagar el monitor a los 5.5 min (justo después de bloquear)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspender el equipo a los 15 min
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
